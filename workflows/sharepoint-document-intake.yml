name: sharepoint-document-intake
description: Acquire a bounded SharePoint document set for a separate processing capability
version: 1.0.0
tags: [ericsson, sharepoint, documents]
requires: [ericsson-sharepoint]
inputs:
  - {name: sharepoint_url}
  - {name: destination}
nodes:
  - id: acquire
    kind: tool
    allowed_tools:
      - sharepoint_resolve_url
      - sharepoint_list_items
      - sharepoint_download
    prompt: >
      Acquire only the requested bounded artifact set. Use
      sharepoint_resolve_url to establish normalized identity, use
      sharepoint_list_items only when folder discovery is requested, and use
      sharepoint_download only for the selected files and authorized
      destination. Record relative artifact paths, sizes, digests, warnings,
      truncation, and the normalized remote identities in the output manifest.
    output: sharepoint-intake-manifest.json
report:
  kanban: auto
  notify: []
